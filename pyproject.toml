[project]
name = "xray-detector"
version = "0.1.0"
description = "Detektion av objekt i röntgenvideo med annotering och träning"
requires-python = ">=3.11"
dependencies = [
    "pyside6>=6.7",
    "opencv-python>=4.9",
    "numpy>=1.26",
    "ultralytics>=8.3",
    "psutil>=5.9",
    "pyyaml>=6.0",
    "pygrabber>=0.2; sys_platform == 'win32'",
]

[project.optional-dependencies]
rfdetr = [
    "rfdetr[train]>=1.7",
]
cu128 = [
    "torch>=2.7",
    "torchvision>=0.22",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "extra == 'cu128'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "extra == 'cu128'" },
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["xray_detector"]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "pytest-xdist>=3.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: test som startar MainWindow och därför tar sekunder i stället för millisekunder",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PERF", "RUF"]
ignore = [
    "E501",    # radlängd sköts av formatering, inte av grinden
    "PLC0415", # import utanför toppnivå används medvetet för tunga beroenden
]
# svensk typografi i strängar: tankstreck, gånger-tecken och minustecken
allowed-confusables = ["–", "×", "−"]
