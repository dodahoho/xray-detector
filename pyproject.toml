[project]
name = "xray-detector"
version = "0.1.0"
description = "Applikation för detektion av objekt i video med röntgenbilder, annotering och modellträning"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=1.26.0",
    "opencv-python>=4.9.0",
    "pillow>=10.0.0",
    "pyside6>=6.7.0",
    "pyyaml>=6.0.1",
    "ultralytics>=8.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

