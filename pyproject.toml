[project]
name = "xray-detector"
version = "0.1.0"
description = "Detektion, annotering och träning av objekt i två videoströmmar"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "opencv-python>=4.9",
    "numpy>=1.26",
    "ultralytics>=8.2",
    "pydantic>=2.6",
    "loguru>=0.7",
    "PyYAML>=6.0",
    "torch>=2.7",
    "torchvision>=0.22",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

# CUDA-byggen av PyTorch. Indexet är explicit och används bara för torch/
# torchvision. RTX 50-serien (sm_120) kräver CUDA 12.8+; cu130 kräver en
# NVIDIA-drivrutin som stödjer CUDA 13.x. Byt till cu128 om drivrutinen är äldre.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130" }]
torchvision = [{ index = "pytorch-cu130" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["xray_detector"]
