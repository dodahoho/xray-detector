[project]
name = "xray-detector"
version = "0.1.0"
description = "Detection, annotation and training application for X-ray video streams"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "PySide6>=6.7",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "PyYAML>=6.0",
    "Pillow>=10.0",
]

[project.optional-dependencies]
ml = [
    "torch>=2.5",
    "torchvision>=0.20",
    "ultralytics>=8.4.198",
    "rfdetr>=1.0",
]
windows = [
    "pygrabber>=0.2",
]
build = [
    "pyinstaller>=6.0",
]

[project.scripts]
xray-detector = "xray_detector.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "ruff>=0.6",
    "pyright>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xray_detector"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
qt_api = "pyside6"

[tool.pyright]
pythonVersion = "3.11"
include = ["src"]
exclude = ["**/__pycache__"]
