[project]
name = "xray-detector"
version = "0.1.0"
description = "Detektion av objekt i röntgenvideo med annotering och träning"
requires-python = ">=3.11"
dependencies = [
    "pyside6>=6.7",
    "opencv-python>=4.9",
    "numpy>=1.26",
    "ultralytics>=8.3",
]

[project.optional-dependencies]
rfdetr = [
    "rfdetr>=1.0",
]
cu126 = [
    "torch>=2.6",
    "torchvision>=0.21",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "extra == 'cu126'" },
]
torchvision = [
    { index = "pytorch-cu126", marker = "extra == 'cu126'" },
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["xray_detector"]

[dependency-groups]
dev = [
    "ruff>=0.6",
]
