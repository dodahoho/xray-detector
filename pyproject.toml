[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xray-detector"
version = "0.1.0"
description = "Detektion, annotering och traning av objekt i tva videostrommar"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "PySide6>=6.5",
    "opencv-python>=4.8",
    "numpy>=1.24",
]

[project.optional-dependencies]
detection = ["ultralytics>=8.3"]

[dependency-groups]
dev = ["pytest>=8.0", "pyinstaller>=6.0"]

[project.scripts]
xray-detector = "xray_detector.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
