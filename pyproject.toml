[project]
name = "xray-detector"
version = "0.1.0"
description = "Detektion av objekt i röntgenvideo med annotering och träning"
requires-python = ">=3.11"
dependencies = [
    "pyside6>=6.7",
    "opencv-python>=4.9",
    "numpy>=1.26",
    "ultralytics>=8.3",
    "psutil>=5.9",
    "pygrabber>=0.2; sys_platform == 'win32'",
]

[project.optional-dependencies]
rfdetr = [
    "rfdetr>=1.7",
]
cu128 = [
    "torch>=2.7",
    "torchvision>=0.22",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "extra == 'cu128'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "extra == 'cu128'" },
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["xray_detector"]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
