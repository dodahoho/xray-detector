name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Testerna ritar i Qt utan skärm; offscreen kräver ingen X-server.
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - name: Installera Qt-, OpenCV- och teckensnittsbibliotek
        # PySide6 skeppar inga egna teckensnitt. Offscreen-plattformen ritar text
        # via fontconfig, så märkes- och layouttesterna behöver ett riktigt
        # teckensnitt i stället för Qt:s inbyggda reserv.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 fonts-dejavu-core

      - name: Installera uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Installera beroenden
        run: uv sync --group dev

      - name: ruff
        run: uv run ruff check .

      - name: pytest
        run: uv run pytest -q -n auto
